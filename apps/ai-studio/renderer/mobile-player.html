<body><main id="intro"><h1 id="game-name">Haiyue 游戏预览</h1><p id="mobile-status" role="status">正在检查浏览器…</p><button id="mobile-start" type="button" disabled>开始游戏</button><details><summary>首次连接 / 证书说明</summary><p>电脑与手机需连接同一局域网。首次使用请核对编辑器中的证书指纹，并信任该电脑的预览证书。iPhone 安装后还需在“设置 → 通用 → 关于本机 → 证书信任设置”启用完全信任。</p><a href="./certificate.cer" download="Haiyue-Preview-CA.cer">下载本机预览证书</a><p>游戏需要支持 WebGPU 的浏览器。分享结束后，此链接失效。</p></details></main><section id="mobile-stage" hidden><iframe id="mobile-frame" title="游戏运行画面" sandbox="allow-scripts"></iframe><nav><button id="mobile-restart" type="button">重玩</button><button id="mobile-fullscreen" type="button">全屏</button><button id="mobile-exit" type="button">退出</button></nav></section><script type="module" src="./mobile-player.js"></script></body></html>
